<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratório CIA · T17</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Spectral:wght@500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: sala de aula de arquitetura — claro, direto, didático; cada número explicável
   IDEA: um painel de operação (NOC) que os grupos montam e "quebram" de propósito
   PICTURE: o gráfico demanda × capacidade com faixas de incidente e a régua de status minuto a minuto
   COLOUR and TYPE: branco e tinta #14110f, ultramar #1d2bd8; cores de maturidade N1–N4 dos cards; Spectral títulos + Inter
   LAYOUT: barra superior com grupo e abas; cada aba uma bancada de trabalho até 1240px */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0d0e18);--ink:light-dark(#14110f,#ecebf3);--mute:light-dark(#5d6470,#a3a8b8);
--line:light-dark(#e3e5ea,#262a3d);--soft:light-dark(#f5f6f8,#151827);--card:light-dark(#ffffff,#121524);
--ac:light-dark(#1d2bd8,#8f99ff);--acs:light-dark(#eceefe,#1b1f45);
--n1:#d9481c;--n2:#c99a06;--n3:#1f6fb2;--n4:#2f7d32;--bad:#c62828;--warn:#d98a00;--ok:#2f7d32;
--C:#7b3fb0;--I:#0f7c86;--A:#1f6fb2}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Spectral,Georgia,serif;font-weight:600;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,3.4vw,42px)}h2{font-size:clamp(24px,2.6vw,32px);margin-bottom:6px}h3{font-size:21px;margin-bottom:6px}
p{margin:.4em 0}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:0 auto;padding:12px 16px 0;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.brand{font-family:Spectral,serif;font-size:22px;font-weight:600}
.brand small{font-family:Inter;font-size:14px;color:var(--mute);font-weight:500;margin-left:8px}
.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--mute)}
select,input,textarea,button{font:inherit;font-size:16px;color:var(--ink)}
select,input[type=text],input[type=number],textarea{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;min-height:44px}
textarea{width:100%;min-height:84px;resize:vertical;line-height:1.45}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
button{cursor:pointer;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);padding:8px 14px;font-weight:600}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.sync{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mute)}.dot.on{background:var(--ok)}.dot.wait{background:var(--warn)}
.tabs{max-width:1240px;margin:0 auto;display:flex;gap:2px;padding:6px 10px 0;overflow-x:auto}
.tabs a{flex:none;padding:10px 14px;color:var(--mute);text-decoration:none;font-weight:600;font-size:15px;border-bottom:3px solid transparent}
.tabs a.on{color:var(--ink);border-color:var(--ac)}
main{max-width:1240px;margin:0 auto;padding:22px 16px 70px}
.view{display:none}.view.on{display:block}
.lede{color:var(--mute);max-width:70ch;margin-bottom:18px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.box{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px}
.soft{background:var(--soft);border-radius:14px;padding:16px 18px}
.tag{display:inline-block;font-size:13px;font-weight:700;border-radius:6px;padding:2px 8px;color:#fff;white-space:nowrap}
.L1{background:var(--n1)}.L2{background:var(--n2)}.L3{background:var(--n3)}.L4{background:var(--n4)}
.tC{background:var(--C)}.tI{background:var(--I)}.tA{background:var(--A)}
.mute{color:var(--mute)}.small{font-size:14px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:15px}
th{font-size:13px;color:var(--mute);font-weight:700}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
/* timeline */
.tl{display:grid;gap:8px}
.tlr{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.tlr b.t{font-variant-numeric:tabular-nums;font-size:20px;white-space:nowrap}
.tlr .bk{font-weight:700}
/* arquitetura */
.tier{border-radius:14px;padding:16px 18px;border:2px solid var(--line);background:var(--card)}
.tier.ihc{border-color:#9cc0e4}.tier.ln{border-color:#b8a8dd}.tier.ac{border-color:#9fcca3}
.tierhd{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.lvlrow{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.lvlrow label{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;min-height:40px;cursor:pointer;font-weight:600;font-size:15px}
.lvlrow input{accent-color:var(--ac);width:18px;height:18px}
.tg{margin-top:10px}
.tg h4{margin:10px 0 4px;font-size:14px;display:flex;gap:8px;align-items:center}
.chk{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer;font-size:15px}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--ac);flex:none}
.eff{font-size:15px;margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--soft)}
.eff.gap{background:light-dark(#fff3e0,#3a2a10)}
/* privacidade */
.ladder{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:8px}
.rung{border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:var(--card);text-align:left;font-weight:500}
.rung.on{border-color:var(--ac);background:var(--acs)}
.rung b{display:block;font-size:17px}
.hops{display:grid;gap:8px;margin-top:14px}
.hop{display:grid;grid-template-columns:200px minmax(0,1fr) 120px;gap:12px;align-items:center;border-radius:12px;padding:10px 14px;border:1.5px solid var(--line);background:var(--card)}
.hop code{font-size:14px;overflow-wrap:anywhere}
.st{font-size:13px;font-weight:800;border-radius:6px;padding:3px 8px;text-align:center;white-space:nowrap}
.st.aberto{background:#fde2e1;color:#9b1c1c}.st.cifrado{background:#dbeafe;color:#1e3a8a}.st.token{background:#dcf5df;color:#1f5e23}.st.parcial{background:#fef3c7;color:#7a4b00}
/* simulador */
.simwrap{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px}
.ctl label{display:block;font-size:14px;font-weight:600;margin:10px 0 2px}
.ctl .v{float:right;font-variant-numeric:tabular-nums;color:var(--ac)}
input[type=range]{width:100%;accent-color:var(--ac);min-height:30px}
.inc{border-top:1px solid var(--line);padding:8px 0}
.inc .chk{padding:4px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px}
.kpi{border-radius:12px;padding:12px 14px;background:var(--soft)}
.kpi b{display:block;font-size:clamp(22px,2.4vw,30px);font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap}
.kpi span{font-size:13px;color:var(--mute)}
.kpi.bad b{color:var(--bad)}.kpi.good b{color:var(--ok)}.kpi.warn b{color:var(--warn)}
.fig{position:relative;min-height:300px;margin-top:12px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:6px}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:5px;vertical-align:middle}
.log{max-height:300px;overflow:auto;font-size:14px}
.log li{margin:4px 0}
.levels{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
/* ficha */
.fc{display:grid;grid-template-columns:160px minmax(0,1fr);gap:8px 12px;align-items:start}
.fc label{font-weight:700;font-size:14px;padding-top:10px}
.fc input,.fc select{width:100%}
.attrtabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.attrtabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* supervisor + painel */
.qlist .chk{border-bottom:1px solid var(--line)}
.obj{border-left:5px solid var(--ac);padding:8px 12px;background:var(--soft);border-radius:0 10px 10px 0;margin:8px 0}
.mural{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.note{border-radius:12px;padding:12px 14px;background:light-dark(#fff8d6,#2c2712);border:1px solid light-dark(#efdf95,#4a4120)}
.note .meta{font-size:13px;color:var(--mute);margin-bottom:4px}
.prov{border-radius:14px;padding:16px 18px;background:light-dark(#fff3e0,#33240c);border:1.5px solid light-dark(#f3cf8b,#5c4212);margin-top:16px}
.bar100{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
.bar100 i{display:block;height:100%}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media(max-width:860px){.simwrap{grid-template-columns:minmax(0,1fr)}.hop{grid-template-columns:minmax(0,1fr)}.fc{grid-template-columns:minmax(0,1fr)}.fc label{padding-top:4px}}
@media(max-width:600px){.tlr{grid-template-columns:minmax(0,1fr);gap:4px}table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mute);font-size:12px}.stack td:empty{display:none}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>

<script>
{

 ihc:{2:[['ihc_mon','Monitoração de infra do provedor (CPU, rede)'],['ihc_sup','Canal de suporte para o cliente reclamar']],

const LVN = {1:'N1 · sem controle',2:'N2 · processos manuais',3:'N3 · malha aberta',4:'N4 · malha fechada'};

 {n:'P0',t:'Dados em aberto',d:'HTTP sem TLS; banco e backups em texto claro; logs com CPF e cartão.',fonte:'Situação a evitar'},

const MALW = [

/* ===================== NÍVEL EFETIVO ===================== */
function eff(tier,tat){
  let L=1;
  for(const k of [2,3,4]){ if(TAT[tier][k].every(([id])=>tat[id])) L=k; else break; }
  return L;
}
function missing(tier,tat){
  const L=eff(tier,tat); if(L===4) return null;
  return {L:L+1,f:TAT[tier][L+1].filter(([id])=>!tat[id]).map(x=>x[1])};
}
const effAll = tat=>({ihc:eff('ihc',tat),ln:eff('ln',tat),ac:eff('ac',tat)});

/* ===================== SIMULAÇÃO (modelo didático) ===================== */
function simulate(st){
  const p=st.sim.p, cs=CASES[st.arq.caso], tat=st.arq.tat, E=effAll(tat), P=st.priv.nivel;
  const B=p.B, M=p.M;
  const dem=t=>{
    if(p.forma==='rajada'){
      if(t<p.t0-5) return B;
      if(t<p.t0) return B+(B*(M-1))*((t-(p.t0-5))/5)*.3;
      return B+B*(M-1)*Math.exp(-(t-p.t0)/(p.dur/3));
    }
    if(t<p.t0) return B;
    if(t<p.t0+p.dur){const r=Math.min(1,(t-p.t0)/15);return B+(B*M*(0.93+0.07*Math.sin((t-p.t0)/9))-B)*r;}
    return B+(B*M-B)*Math.exp(-(t-p.t0-p.dur)/15);
  };
  const capT=(L,t)=>{
    if(L===1) return 1.3*B;
    if(L===2) return 2.5*B;
    if(L===3) return Math.min(30*B,Math.max(2.5*B,dem(Math.max(0,t-8))*1.25));
    return Math.min(80*B,Math.max(2.5*B,dem(t+5)*1.3));
  };
  // janelas de incidente
  const act=[], ev=[];
  INC.forEach(I=>{
    const o=st.sim.inc[I.id]; if(!o||!o.on) return;
    const L=E[I.tier], d=I.d[L-1], r=I.r[L-1];
    act.push({I,L,a:o.t,b:o.t+d+r,d,r});
  });
  const series=[]; let Q=0, collapseSaid=false;
  const m={indisp:0,degr:0,perd:0,atend:0,inco:0,incoAuto:0,dup:0,botsBuy:0,expostos:0,takeovers:0,excl:0,rpo:''};
  let prevD=dem(0);
  for(let t=0;t<H;t++){
    let Dh=dem(t);
    let Db=0, f=1, secInc=false, pagInc=false, wifi=false;
    act.forEach(x=>{
      if(t<x.a||t>=x.b) return;
      const L=x.L;
      if(x.I.id==='i4'){secInc=true; if(t<x.a+30) Db=B*p.bots*[1,1,.3,.03][E.ihc-1];}
      else if(x.I.id==='i3'){pagInc=true; if(t<x.a+30) f*=x.I.f[E.ln-1];}
      else if(x.I.id==='i6'){wifi=true;}
      else { if(x.I.id==='i5') secInc=true; f*=x.I.f[L-1]; }
    });
    if(E.ihc>=4 && Dh>capT(E.ihc,t)) Dh*=0.8; // degradação graciosa: corta tráfego não crítico
    const D=Dh+Db;
    let cap=Math.min(capT(E.ihc,t),capT(E.ln,t),capT(E.ac,t))*f;
    if(D>cap*1.3 && E.ln<3 && f>0){cap*=0.5; if(!collapseSaid){collapseSaid=true;ev.push([t,'bad',`Sobrecarga sem fila/circuit breaker: threads presas e deadlocks — a capacidade cai pela metade (efeito avalanche).`]);}}
    let served, failed=0, aband=0, status='ok';
    if(E.ihc>=3){
      const want=D+Q; served=Math.min(want,cap); Q=want-served; aband=Q*0.08; Q-=aband;
      const wait=cap>0?Q/cap:99;
      if(cap<0.1*B) status='down'; else if(wait>15) status='degr';
    } else {
      served=Math.min(D,cap); failed=D-served;
      const r=D>0?served/D:1;
      if(r<0.5) status='down'; else if(r<0.9) status='degr';
    }
    const hs=D>0?Dh/D:1;
    const human=served*hs;
    m.atend+=human; m.perd+=failed*hs+aband*hs;
    if(Db>0 && st.arq.caso==='ingressos') m.botsBuy+=served*(1-hs)*0.5;
    const over=Math.max(0,D/Math.max(cap,1)-1);
    const Lc=Math.min(E.ln,E.ac);
    const ir=[0.004,0.002,0.0002,0.00002][Lc-1]*(1+over);
    if(Lc>=4) m.incoAuto+=human*ir; else m.inco+=human*ir;
    if(pagInc && E.ln<3) m.dup+=human*0.04;
    if(wifi) m.expostos+= P===0? human*0.05 : 0;
    if(status==='down'){m.indisp++; if(secInc) m.excl++;}
    if(status==='degr') m.degr++;
    series.push({t,D,Dh,cap,served,status});
    prevD=D;
  }
  // eventos narrativos e métricas de C
  let sd=0,sr=0,n=0;
  act.forEach(x=>{
    const I=x.I, L=x.L;
    if(I.id==='i6'){
      ev.push([x.a, P===0?'bad':'good', P===0?`${I.nome}: sem TLS, quem está na mesma rede lê CPF e cartão das transações.`:`${I.nome}: o tráfego está cifrado (P${P}); nada legível foi capturado.`]);
      return;
    }
    n++; sd+=x.d; sr+=x.r;
    ev.push([x.a,'inc',`${I.nome} (camada ${I.tier.toUpperCase()}, ${LVN[L]}).`]);
    ev.push([x.a+x.d,L>=4?'good':L===3?'warn':'bad',`Detectado em ${fmt(x.d,1)} min por ${QUEM[L]}. ${I.como[L-1]}.`]);
    const fim=x.b; ev.push([Math.min(fim,H-1),L>=3?'good':'bad',fim>H?`Ainda não recuperado ao fim da janela (${fmt(x.r)} min de recuperação).`:`Recuperado após ${fmt(x.r,1)} min.`]);
    if(I.id==='i4'){
      m.takeovers=p.tent*[0.01,0.008,0.002,0.0001][E.ihc-1];
      const per=P>=4?0:1; m.expostos+=m.takeovers*per;
    }
    if(I.id==='i5'){
      const ex=p.clientes*[1,1,0,0,0][P];
      m.expostos+=ex;
      m.rpo=['tudo (sem backup útil)','até 24 h de pedidos','até 1 h de pedidos','zero (point-in-time)'][E.ac-1];
      ev.push([x.a+x.d,P>=2?'good':'bad',P>=2?`Malware copiou o banco, mas os dados estão cifrados com chave fora do servidor (P${P}).`:`Malware copiou o banco em texto claro: ${fmt(ex)} cadastros expostos.`]);
    }
  });
  ev.sort((a,b)=>a[0]-b[0]);
  const budget=(1-cs.sla/100)*43200;
  const custo=Object.keys(tat).filter(k=>tat[k]).reduce((s,k)=>{for(const T of ['ihc','ln','ac'])for(const L of [2,3,4])if(TAT[T][L].some(x=>x[0]===k))return s+(L-1);return s;},0)+P*2;
  const res={
    disp:100*(1-m.indisp/H), mes:100*(1-m.indisp/43200), indisp:m.indisp, degr:m.degr, budget, budgetPct:100*m.indisp/budget,
    perd:Math.round(m.perd), atend:Math.round(m.atend), receita:Math.round(m.perd*p.ticket),
    inco:Math.round(m.inco+m.dup), incoAuto:Math.round(m.incoAuto), botsBuy:Math.round(m.botsBuy),
    expostos:Math.round(m.expostos), takeovers:Math.round(m.takeovers), excl:m.excl, rpo:m.rpo,
    mttd:n?sd/n:0, mttr:n?sr/n:0, custo, E, P
  };
  return {series,ev,res};
}

/* ===================== PERSISTÊNCIA ===================== */
function setSync(s,t){ $('#syncDot').className='dot '+s; $('#syncTxt').textContent=t; }
function touch(sec){ lastLocal[sec]=Date.now(); clearTimeout(timers[sec]); timers[sec]=setTimeout(()=>flush(sec,grp),900); }
async function flush(sec,g){
  clearTimeout(timers[sec]); timers[sec]=null;
  if(!db) return;
  if(inflight[sec]){again[sec]=g;return;}
  inflight[sec]=true; setSync('wait','salvando…');
  try{ await db.doc(`grupos/${g}/secoes/${sec}`).set(Object.assign(clone(S[sec]),{_ts:Date.now()})); setSync('on','salvo · compartilhado'); }
  catch(e){ setSync('', e&&e.code==='invalid_argument'?'somente leitura':'erro ao salvar'); }
  inflight[sec]=false;
  if(again[sec]){const g2=again[sec];again[sec]=null;flush(sec,g2);}
}
function flushAll(){ SECS.forEach(s=>{ if(timers[s]) flush(s,grp); }); }
function merge(sec,data){
  const d=defaults(grp)[sec]; const o=Object.assign(d,clone(data||{})); delete o._ts;
  if(sec==='sim'){o.p=Object.assign(clone((CASES[S.arq.caso]||CASES[GROUPS[grp].caso]).p),o.p||{}); o.inc=Object.assign(defaults(grp).sim.inc,o.inc||{});}
  if(sec==='ficha'){['C','I','A'].forEach(a=>o[a]=Object.assign(defaults(grp).ficha[a],o[a]||{}));}
  if(sec==='arq'){o.tat=o.tat||{}; if(!CASES[o.caso]) o.caso=GROUPS[grp].caso;}
  if(sec==='priv'){o.nivel=Math.max(0,Math.min(4,Number(o.nivel)||0));}
  return o;
}
function loadGroupFromRemote(){
  const r=remote[grp]; S=defaults(grp);
  SECS.forEach(s=>{ if(r[s]) S[s]=merge(s,r[s]); });
}
function editingText(){ const a=document.activeElement; return a && a.closest && a.closest('main') && (a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&a.type==='text')); }
function onRemote(g,snap){
  snap.docs.forEach(d=>{ remote[g][d.id]=d.data(); });
  if(g===grp){
    let ch=false;
    SECS.forEach(s=>{ const r=remote[g][s]; if(!r) return; if(timers[s]||inflight[s]||Date.now()-(lastLocal[s]||0)<3000) return;
      const nx=merge(s,r); if(JSON.stringify(nx)!==JSON.stringify(S[s])){S[s]=nx;ch=true;} });
    if(ch && !editingText()) renderCurrent();
  }
  if(cur==='painel') renderPainel();
}
async function connect(){
  const timer=setTimeout(()=>{ if(!db) setSync('','modo local (sem dados compartilhados)'); },10000);
  try{ db = window.claude && claude.use ? await claude.use('db') : null; }catch(e){ db=null; }
  try{ user = window.claude && claude.use ? await claude.use('user') : null; owner = user ? !!(await user.isOwner()) : false; }catch(e){ owner=false; }
  if(!db){ clearTimeout(timer); setSync('','modo local (sem dados compartilhados)'); return; }
  setSync('wait','sincronizando…');
  let first=true;
  Object.keys(GROUPS).forEach(g=>{
    db.collection(`grupos/${g}/secoes`).onSnapshot(s=>{ if(first&&!s.metadata.fromCache){first=false;clearTimeout(timer);setSync('on','conectado · compartilhado');} onRemote(g,s); },
      e=>{ setSync('','sem conexão com os dados'); });
  });
  db.collection('conversas').orderBy('ts','desc').limit(200).onSnapshot(s=>{ mural=s.docs.map(d=>({id:d.id,...d.data()})); if(cur==='supervisor')renderMural(); if(cur==='painel')renderPainel(); }, ()=>{});
  if(cur==='painel') renderPainel();

let ro=null;
function chartObs(){ const f=$('#fig'); if(!f) return; if(ro) ro.disconnect(); ro=new ResizeObserver(drawChart); ro.observe(f); drawChart(); }
function drawChart(){
  const s=$('#chart'); if(!s||!lastSim) return;
  const W=s.clientWidth, Hh=s.clientHeight; if(!W||!Hh) return;
  const pad={l:52,r:14,t:24,b:44}, w=W-pad.l-pad.r, h=Hh-pad.t-pad.b;
  const se=lastSim.series; const ymax=Math.max(...se.map(d=>Math.max(d.D,Math.min(d.cap,d.D*1.6))))*1.08||1;
  const X=t=>pad.l+t/(H-1)*w, Y=v=>pad.t+h-Math.min(v,ymax)/ymax*h;
  const line=k=>se.map((d,i)=>`${i?'L':'M'}${X(d.t).toFixed(1)},${Y(d[k]).toFixed(1)}`).join('');
  const bands=[]; let a=null;
  se.forEach(d=>{ const on=d.status!=='ok'; if(on&&a===null)a=d.t; if((!on||d.t===H-1)&&a!==null){bands.push([a,on?d.t:d.t-1]);a=null;} });
  const yt=[0,.25,.5,.75,1].map(f=>f*ymax);
  const sm=W<520;
  s.innerHTML=`
   ${yt.map(v=>`<line x1="${pad.l}" x2="${W-pad.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="currentColor" opacity=".1"/>${sm?'':`<text x="${pad.l-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="currentColor" opacity=".6">${fmt(v)}</text>`}`).join('')}
   ${bands.map(b=>`<rect x="${X(b[0])}" y="${pad.t}" width="${Math.max(2,X(b[1])-X(b[0]))}" height="${h}" fill="rgba(198,40,40,.13)"/>`).join('')}
   <path d="${line('D')}" fill="none" stroke="#8a909b" stroke-width="2"/>
   <path d="${line('cap')}" fill="none" stroke="var(--ac)" stroke-width="2" stroke-dasharray="5 4"/>
   <path d="${line('served')}" fill="none" stroke="var(--ok)" stroke-width="2.5"/>
   ${se.map(d=>`<rect x="${X(d.t)}" y="${pad.t+h+8}" width="${w/H+.6}" height="10" fill="${d.status==='ok'?'var(--ok)':d.status==='degr'?'var(--warn)':'var(--bad)'}"/>`).join('')}
   ${[0,60,120,180,239].map(t=>`<text x="${X(t)}" y="${Hh-6}" text-anchor="${t===0?'start':t===239?'end':'middle'}" font-size="11" fill="currentColor" opacity=".6">${t} min</text>`).join('')}
   <text x="${pad.l-6}" y="12" text-anchor="end" font-size="11" fill="currentColor" opacity=".6">${sm?'':'pedidos/min'}</text>`;
}

  if(!db){ m.innerHTML='<p class="mute">O mural precisa da conexão com os dados compartilhados.</p>'; return; }
  if(!mural.length){ m.innerHTML='<p class="mute">Nenhuma abordagem publicada ainda.</p>'; return; }
  m.innerHTML=mural.map(n=>`<div class="note"><div class="meta">${esc(String(n.grupo||'').toUpperCase())} · ${esc(n.contexto)} · objeção: ${esc(OBJ[n.objecao]?.[0]||'')}</div><ul class="small">${(Array.isArray(n.perguntas)?n.perguntas:[]).map(i=>`<li>${esc(QUEST[i]||'')}</li>`).join('')}</ul><div class="small">${esc(n.mensagem)}</div></div>`).join('');
}

function renderPainel(){
  const el=$('#v-painel'); if(cur!=='painel') return;
  const rows=Object.keys(GROUPS).map(g=>{
    const R=remote[g]; const arq=R.arq?merge2('arq',R.arq,g):null; const caso=arq?arq.caso:GROUPS[g].caso;
    const E=arq?effAll(arq.tat||{}):null; const P=R.priv?Math.max(0,Math.min(4,Number(R.priv.nivel)||0)):null; const x=R.sim&&R.sim.res; const cs=CASES[caso]||CASES[GROUPS[g].caso];
    const fi=R.ficha; const nf=fi?['C','I','A'].filter(a=>fi[a]&&fi[a].adr&&fi[a].resposta).length:0;
    return {g,caso,cs,E,P,x,nf};
  });
  el.innerHTML=`
  <h1>Painel da turma</h1>
  <p class="lede">Atualiza sozinho quando os grupos mudam a arquitetura ou rodam o simulador. Use no pitch e na consolidação.</p>
  ${!db?'<div class="prov small">Sem conexão com os dados compartilhados: o painel mostra apenas este navegador.</div>':''}
  <div class="scroll"><table class="stack"><thead><tr><th>Grupo</th><th>Caso</th><th>IHC</th><th>LN</th><th>Acesso</th><th>Priv.</th><th class="num">Fora (min)</th><th class="num">Orçamento</th><th class="num">Pedidos perdidos</th><th class="num">Inconsist.</th><th class="num">Expostos</th><th class="num">Custo</th><th class="num">Fichas</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td><b>${r.g.toUpperCase()}</b></td><td>${r.cs.curto}</td>${r.E?['ihc','ln','ac'].map(t=>`<td>${lvTag(r.E[t])}</td>`).join(''):'<td></td><td></td><td></td>'}<td>${r.P!=null?`<span class="tag tC">P${Number(r.P)||0}</span>`:''}</td>
   ${r.x?`<td class="num">${fmt(r.x.indisp)}</td><td class="num"><span style="color:${r.x.indisp<=r.x.budget?'var(--ok)':'var(--bad)'}">${fmt(r.x.budgetPct)}%</span><div class="bar100"><i style="width:${Math.min(100,Number(r.x.budgetPct)||0)}%;background:${r.x.indisp<=r.x.budget?'var(--ok)':'var(--bad)'}"></i></div></td><td class="num">${fmt(r.x.perd)}</td><td class="num">${fmt(r.x.inco)}</td><td class="num">${fmt(r.x.expostos)}</td><td class="num">${fmt(r.x.custo)}</td>`:'<td class="num mute">—</td><td></td><td></td><td></td><td></td><td></td>'}
   <td class="num">${r.nf}/3</td></tr>`).join('')}
  </tbody></table></div>
  <div class="prov"><h3>Provocação para a consolidação</h3>
   <p>A especificação de disponibilidade do e-commerce exclui do SLA “ataques DDoS ou incidentes de segurança de grande escala” e “falhas de provedores terceiros”. Somando os grupos, <b>${fmt(rows.reduce((s,r)=>s+(r.x?Number(r.x.excl)||0:0),0))} minutos</b> fora do ar caíram nessa exclusão.</p>
   <p><b>Seu SLA protege o cliente ou o fornecedor?</b> Em N4, a arquitetura deveria assumir parte desse risco em vez de excluí-lo do contrato?</p></div>
  <div class="grid g2" style="margin-top:16px">
   <div class="box"><h3>Perguntas mais escolhidas na Dinâmica 2</h3>${topQ()}</div>
   <div class="box"><h3>Professor</h3><p class="small mute">Limpa todas as entradas dos grupos e o mural para a próxima turma.</p>${owner?`<button data-act="reset1">Limpar dados da turma</button><span id="resetConf"></span>`:'<p class="small mute">Disponível só para o dono da página.</p>'}</div>
  </div>`;
}
function merge2(sec,data,g){ const d=defaults(g)[sec]; return Object.assign(d,clone(data||{})); }
function topQ(){
  if(!mural.length) return '<p class="mute small">Sem publicações ainda.</p>';
  const c=new Array(QUEST.length).fill(0); mural.forEach(n=>(Array.isArray(n.perguntas)?n.perguntas:[]).forEach(i=>{if(c[i]!=null)c[i]++;}));
  const mx=Math.max(...c)||1;
  return c.map((v,i)=>[v,i]).filter(x=>x[0]).sort((a,b)=>b[0]-a[0]).slice(0,6).map(([v,i])=>`<div class="small" style="margin:8px 0">${esc(QUEST[i])}<div class="bar100"><i style="width:${v/mx*100}%;background:var(--ac)"></i></div><span class="mute">${v} escolha(s)</span></div>`).join('');
}

/* ===================== EVENTOS ===================== */
let toastT=null; function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>e.classList.remove('on'),2600); }
async function copy(txt){ try{ await navigator.clipboard.writeText(txt); toast('Copiado.'); }catch(e){ toast('Não foi possível copiar; selecione o texto manualmente.'); } }
const main=$('#main');
main.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.tat){ S.arq.tat[t.dataset.tat]=t.checked; touch('arq'); recompute(); renderArq(); return; }
  if(t.dataset.act==='caso'){ S.arq.caso=t.value; S.sim.p=clone(CASES[t.value].p); touch('arq'); recompute(); touch('sim'); renderCaso(); return; }
  if(t.dataset.inc){ S.sim.inc[t.dataset.inc].on=t.checked; renderSimOut(true); return; }
  if(t.dataset.pf){ S.sim.p.forma=t.value; renderSimOut(true); return; }
  if(t.dataset.f && t.tagName==='SELECT'){ S.ficha[attrSel][t.dataset.f]=t.value; touch('ficha'); return; }
  if(t.id==='d2ctx'){ d2ctx=t.value; return; }
  if(t.id==='d2obj'){ d2obj=Number(t.value); return; }
  if(t.dataset.q!=null){ const i=Number(t.dataset.q); if(t.checked){ if(d2sel.size>=3){t.checked=false;toast('Escolha no máximo 3 perguntas.');return;} d2sel.add(i);} else d2sel.delete(i); const p=t.closest('.box').querySelector('p.small b'); if(p) p.parentElement.innerHTML=`<b>Escolha 3 perguntas</b> (${d2sel.size}/3)`; return; }
});
main.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.p){ S.sim.p[t.dataset.p]=Number(t.value); const v=$('#v_'+t.dataset.p); if(v) v.textContent=fmt(t.value)+(t.dataset.p==='M'||t.dataset.p==='bots'?'×':''); renderSimOut(true); return; }
  if(t.dataset.inct){ S.sim.inc[t.dataset.inct].t=Number(t.value); const v=$('#vt_'+t.dataset.inct); if(v) v.textContent=t.value; renderSimOut(true); return; }
  if(t.dataset.f && t.tagName!=='SELECT'){ S.ficha[attrSel][t.dataset.f]=t.value; touch('ficha'); return; }
});
main.addEventListener('click',async e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.priv!=null){ S.priv.nivel=Number(b.dataset.priv); touch('priv'); recompute(); renderPriv(); return; }
  if(b.dataset.attr){ attrSel=b.dataset.attr; renderFicha(); return; }
  const a=b.dataset.act;
  if(a==='resetsim'){ S.sim.p=clone(C().p); S.sim.inc=defaults(grp).sim.inc; renderSim(); touch('sim'); toast('Valores do caso restaurados.'); }
  if(a==='prefill') prefill();
  if(a==='copymd') copy(fichaMd());
  if(a==='dlmd'){ const d=await claudeDl(); if(d){ try{ await d.save({filename:`ficha-cia-${grp}.md`,data:fichaMd()}); }catch(err){ toast('Download cancelado.'); } } }
  if(a==='copymsg') copy($('#d2msg').value);
  if(a==='pub'){
    if(!db){ toast('Sem conexão: não é possível publicar no mural.'); return; }
    if(d2sel.size!==3){ toast('Escolha exatamente 3 perguntas.'); return; }
    const msg=$('#d2msg').value.trim().slice(0,1200); if(!msg){toast('Escreva a mensagem.');return;}
    b.disabled=true;
    try{ await db.collection('conversas').add({grupo:grp,contexto:d2ctx,perguntas:[...d2sel],objecao:d2obj,mensagem:msg,ts:Date.now()}); toast('Publicado no mural.'); }
    catch(err){ toast(err&&err.code==='quota_exceeded'?'O mural está cheio; peça ao professor para limpar.':'Não foi possível publicar.'); }
    b.disabled=false;
  }
  if(a==='reset1'){ $('#resetConf').innerHTML=' <button data-act="reset2" class="pri">Confirmar: apagar tudo</button>'; }
  if(a==='reset2'){
    b.disabled=true;
    try{ for(const g of Object.keys(GROUPS)) for(const s of SECS) await db.doc(`grupos/${g}/secoes/${s}`).delete();
      const all=await db.collection('conversas').get(); for(const d of all.docs) await db.collection('conversas').doc(d.id).delete();
      Object.keys(remote).forEach(g=>remote[g]={}); mural=[]; S=defaults(grp); toast('Dados da turma apagados.'); renderPainel(); }
    catch(err){ toast('Não foi possível apagar tudo.'); }
  }
});
$('#grp').value=grp;
$('#grp').addEventListener('change',e=>{
  flushAll(); grp=e.target.value; try{localStorage.setItem('cia_grp',grp);}catch(err){}
  loadGroupFromRemote(); attrSel='A'; renderCurrent(); toast(`Agora você edita o ${grp.toUpperCase()}.`);
});
window.addEventListener('hashchange',route);
route();
connect();
}
</script>
</body>
